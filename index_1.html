:root{
  --land:#ffffff; --water:#cfe2f1; --water-ink:#5b8db3; --park:#eaf3e6; --road-m:#cdd2da; --road-s:#e3e6eb; --ped:#f3d7a8;
  --label:#5d6573; --ink:#1b2130; --muted:#6c7483; --panel:#fbfbfc; --line:#e4e7ec; --chip:#f1f3f6;
  --accent:#0f6f78; --accent-ink:#ffffff; --ok:#1e9b57; --warn:#d18f00; --bad:#d23f3f; --none:#9aa1ad; --comp:#7b3fe4; --mark:#2b3242; --outside:#f2f3f5; --icon-bg:#fffaf0; --icon-ring:#b79a6b; --icon-ink:#5a4424; --bld:#eceae6; --bld-edge:#d6d2cb; --kbld:#f1e6d6; --wall:#b79a6b; --wall-ink:#8a6f45; --zebra:#ffffff; --hn:#5d6573; --hn-p:#2f6f8f; --hn-r:#7a5a2a;
  --shadow:0 6px 24px rgba(20,28,40,.14);
  --f-ui:"Golos Text", "Segoe UI", system-ui, sans-serif; --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
:root[data-map="dark"]{

  --label:#9aa3b1; --ink:#e9ebef; --muted:#9aa1ad; --panel:#1b1f26; --line:#2d333c; --chip:#252a33;
  --accent:#3fb3bd; --accent-ink:#0d1a1c; --ok:#3cc47a; --warn:#f0b432; --bad:#ff6b6b; --none:#7b8391; --comp:#a97bff; --mark:#e9ebef; --outside:#0e1014; --icon-bg:#2a2520; --icon-ring:#c9a96e; --icon-ink:#f0d9a8; --bld:#232831; --bld-edge:#323944; --kbld:#2e2a24; --wall:#8d7b5c; --wall-ink:#d8bf92; --zebra:#d9dde3; --hn:#a6aebb; --hn-p:#7fc0df; --hn-r:#e0b46e;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--land);color:var(--ink);font:14px/1.4 var(--f-ui);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.sum{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.sum b{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:var(--chip)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.spacer{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{display:grid;grid-template-columns:1fr 360px;min-height:0}
#stage{position:relative;overflow:hidden;touch-action:none;cursor:grab;background:var(--outside);min-height:0}
.boxbg{fill:var(--land)}
#stage.drag{cursor:grabbing}
#stage.placing{cursor:crosshair}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.w{fill:var(--water);stroke:none}
.g{fill:var(--park);stroke:none}
.rm,.rs,.rp{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.bd{fill:var(--bld);stroke:var(--bld-edge);stroke-width:1px;vector-effect:non-scaling-stroke}
.kb{fill:var(--kbld);stroke:var(--bld-edge);stroke-width:1px;vector-effect:non-scaling-stroke}
.towers rect{fill:var(--wall)}
.wall{fill:none;stroke:var(--wall);stroke-linecap:square;vector-effect:non-scaling-stroke}
.zebra line{stroke:var(--zebra);stroke-width:4;stroke-dasharray:1 1}
.hn{position:absolute;left:0;top:0;font-size:10px;font-weight:600;color:var(--hn);pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap}
.hn.p{color:var(--hn-p)} .hn.r{color:var(--hn-r)}
.kname{position:absolute;left:0;top:0;font-size:11px;font-weight:600;color:var(--wall-ink);pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
.kname.big{font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
#stage,#stage *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.rm{stroke:var(--road-m)} .rs{stroke:var(--road-s)} .rp{stroke:var(--ped)}
#ov{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;color:var(--label);pointer-events:none;transform-origin:0 0;text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 2px var(--land)}
.lbl.m{font-weight:600}
.lbl.p{color:#b07a26;font-weight:600}
:root[data-map="dark"] .lbl.p{color:#e0b46e}
.lbl.wn{color:var(--water-ink);font-style:italic;font-size:12px}
.metro{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink);pointer-events:none;text-shadow:0 0 3px var(--land),0 0 3px var(--land)}
.metro i{font-style:normal;width:15px;height:15px;border-radius:50%;background:#d62e2e;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700;text-shadow:none}
.entr{position:absolute;left:0;top:0;display:flex;align-items:center;gap:2px;transform:translate(-50%,-50%);pointer-events:none}
.entr i{font-style:normal;width:14px;height:14px;border-radius:3px;background:#d62e2e;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700}
.entr b{font-size:10px;font-weight:700;color:#d62e2e;background:var(--land);border-radius:3px;padding:0 2px}
.mk{position:absolute;left:0;top:0;width:0;height:0}
.mk .sc{position:absolute;left:0;top:0;transform-origin:0 0}
.mk .pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:30px;height:30px;box-sizing:border-box;border-radius:50%;background:var(--panel);border:3px solid var(--none);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink);box-shadow:var(--shadow);cursor:grab;touch-action:none}
.mk .pin,.mk .nm{pointer-events:auto}
.mk.drag .pin{cursor:grabbing}
.mk.movable .pin{cursor:grab;outline:3px dashed var(--accent);outline-offset:3px}
#regF{flex:1;min-width:0}
.mk.ok .pin{border-color:var(--ok)} .mk.warn .pin{border-color:var(--warn)} .mk.bad .pin{border-color:var(--bad)}
.mk .nm{position:absolute;left:19px;top:0;transform:translateY(-50%);font-size:11px;font-weight:600;background:var(--panel);padding:1px 6px;border-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.12);white-space:nowrap;cursor:pointer}
.mk.comp .pin{width:22px;height:22px;border-radius:5px;transform:translate(-50%,-50%) rotate(45deg);border-color:var(--comp);background:var(--comp)}
.mk.comp .pin span{transform:rotate(-45deg);color:#fff;font-size:10px}
.mk.comp .nm{color:var(--comp);left:16px}
.mk.lm .pin{width:12px;height:12px;border-radius:3px;border:2px solid var(--panel);background:var(--mark);box-shadow:none}
.mk.lm .nm{left:10px;background:none;box-shadow:none;padding:0;font-size:12px;font-weight:700;text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 3px var(--land)}
.mk.lm.ic .pin,.mk.lm.ph .pin{border-radius:50%;width:50px;height:50px;border:3px solid var(--icon-ring);background:var(--icon-bg) center/cover no-repeat;color:var(--icon-ink);box-shadow:var(--shadow)}
.mk.lm.ic .pin svg{width:30px;height:30px;display:block}
.mk.lm.ic .nm,.mk.lm.ph .nm{left:0;top:29px;transform:translateX(-50%);font-size:11px;color:var(--icon-ink)}
.mk.lm.ph .pin{border-radius:12px}
.mk.lm.cut .pin{width:62px;height:62px;border:0;border-radius:0;background:transparent center bottom/contain no-repeat;box-shadow:none;transform:translate(-50%,-90%);filter:drop-shadow(0 0 1.5px var(--land)) drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.mk.lm.cut .nm{left:0;top:8px;transform:translateX(-50%);background:none;box-shadow:none;padding:0;font-size:11px;font-weight:700;color:var(--icon-ink);text-shadow:0 0 3px var(--land),0 0 3px var(--land),0 0 3px var(--land)}
.mk.lm.cut.sel .pin{outline:0;filter:drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 2px var(--accent))}
#marks.tiny .nm{display:none}
.mk.sel .pin{outline:3px solid var(--accent);outline-offset:2px}
.stairs-b{fill:none;stroke:var(--bld-edge);stroke-width:5.5;stroke-linejoin:round}
.stairs-s{fill:none;stroke:var(--bld);stroke-width:4.5;stroke-dasharray:.9 .7;stroke-linejoin:round}
.entr{z-index:3}
.pop{position:absolute;left:0;top:0;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;width:260px;max-width:calc(100vw - 32px);transform:translate(-50%,calc(-100% - 22px));z-index:5;cursor:default}
.pop h3{margin:0 0 2px;font-size:14px}
.pop .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.pop .rows{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;margin-bottom:10px}
.pop .rows span:nth-child(odd){color:var(--muted)}
.pop .acts{display:flex;gap:6px;flex-wrap:wrap}
.pop .x{position:absolute;right:6px;top:4px;border:0;background:none;font-size:18px;color:var(--muted);padding:2px 6px}
.pop select{width:100%;margin:4px 0 8px}
.mono{font-family:var(--f-mono);font-size:12px}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:4}
.zoom button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:18px;box-shadow:var(--shadow)}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--land);padding:8px 12px;border-radius:9px;font-size:13px;display:flex;gap:10px;align-items:center;z-index:6;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.banner[hidden]{display:none}
.banner button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 8px}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;font-size:11px;color:var(--muted);background:var(--panel);padding:4px 8px;border-radius:6px;border:1px solid var(--line);z-index:4}
aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:10px 12px 0}
.tab{border:0;background:none;padding:7px 8px;border-radius:8px 8px 0 0;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab small{font-weight:500;color:var(--muted);margin-left:3px}
.list{overflow:auto;flex:1;padding:8px 12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--land);display:grid;gap:4px;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card.sel{border-color:var(--accent)}
.card .top{display:flex;align-items:center;gap:8px}
.card .top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.st{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.st.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.st.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.st.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.st.none{color:var(--none);background:var(--chip)}
.off{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 6px}
.empty{color:var(--muted);font-size:13px;padding:16px 4px;line-height:1.5}
.listhead{display:flex;gap:8px;align-items:center;padding:10px 12px}
.listhead input{flex:1;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--land);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;box-sizing:border-box}
form.ed{overflow:auto;flex:1;padding:12px;display:grid;gap:10px;align-content:start;border-top:1px solid var(--line)}
form.ed h2{margin:0;font-size:15px}
form.ed label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
form.ed .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form.ed .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.note{font-size:12px;color:var(--warn);padding:0 12px 8px}
.note:empty{display:none}
@media (max-width:760px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  main{grid-template-columns:1fr}
  #stage{height:62vh}
  aside{border-left:0;border-top:1px solid var(--line)}
  .list,form.ed{overflow:visible}
  .hint{display:none}
}
@media (prefers-reduced-motion:no-preference){.pop{animation:pin .14s ease-out}@keyframes pin{from{opacity:0;margin-top:6px}to{opacity:1;margin-top:0}}}

const shortName=n=>{const p=String(n||'').trim().split(/\s+/);return p.length>1?p[1]+' '+p[0][0]+'.':p[0]||''};
function placeMarks(){const f=Math.max(0.6,Math.min(2.2,S/3.5));marksEl.classList.toggle('tiny',f<0.7);for(const m of mkEls){if(m.el.classList.contains('drag'))continue;const [x,y]=scr(m.x,m.y);m.el.style.left=x+'px';m.el.style.top=y+'px';m.el.firstChild.style.transform=`scale(${f})`}}
function placePop(){const el=popWrap.firstElementChild;if(!el||!popup)return;const [x,y]=scr(popup.x,popup.y);el.style.left=x+'px';el.style.top=y+'px'}
function place(){placeLabels();placeMarks();placePop()}

function summary(){const s=st.staff||[];const warn=s.filter(o=>regCls(o.regUntil)==='warn').length,bad=s.filter(o=>regCls(o.regUntil)==='bad').length,none=s.filter(o=>!o.regUntil).length,off=s.filter(o=>!hasPos(o)).length;
  document.getElementById('sum').innerHTML=`<span class="pill"><b>${s.length}</b> сотрудников</span>`+
   (bad?`<span class="pill"><i class="dot" style="background:var(--bad)"></i><b>${bad}</b> рег. просрочена</span>`:'')+
   `<span class="pill"><i class="dot" style="background:var(--warn)"></i><b>${warn}</b> рег. ≤ 30 дн.</span>`+
   (none?`<span class="pill"><i class="dot" style="background:var(--none)"></i><b>${none}</b> без даты</span>`:'')+
   (off?`<span class="pill"><b>${off}</b> не на карте</span>`:'')+
   `<span class="pill"><i class="dot" style="background:var(--comp)"></i><b>${st.competitors.length}</b> конкурентов</span>`;
  COLL.forEach(c=>document.getElementById('c-'+c).textContent=st[c].length)}

const LABEL={staff:'сотрудника',competitors:'конкурента',landmarks:'ориентир'};
let regMonth='';
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function regMatch(o){if(!regMonth)return true;if(regMonth==='none')return !o.regUntil;if(regMonth==='bad')return regCls(o.regUntil)==='bad';return (o.regUntil||'').slice(0,7)===regMonth}
function monthOptions(){const set=new Set();const d=new Date();for(let i=0;i<12;i++){const x=new Date(d.getFullYear(),d.getMonth()+i,1);set.add(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'))}
  (st.staff||[]).forEach(o=>{if(o.regUntil)set.add(o.regUntil.slice(0,7))});
  const cnt=k=>(st.staff||[]).filter(o=>(o.regUntil||'').slice(0,7)===k).length;
  return [...set].sort().map(k=>{const [y,m]=k.split('-');const n=cnt(k);return `<option value="${k}"${regMonth===k?' selected':''}>до ${MONTHS[+m-1]} ${y}${n?' ('+n+')':''}</option>`}).join('')}
function renderSide(){const side=document.getElementById('side');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(tab==='access'){side.innerHTML=`<div class="listhead"><input id="newMail" type="email" placeholder="email коллеги (Google-аккаунт)"><button class="btn primary sm" id="addMail" type="button">Дать доступ</button></div>
   <div class="list">${st.access.length?st.access.map(a=>`<div class="card"><div class="top"><b>${esc(a.id)}</b><button class="btn sm danger" data-del="${esc(a.id)}" type="button">Убрать</button></div></div>`).join(''):'<div class="empty">Пока доступ есть только у вас. Добавьте email коллег: после входа через Google они увидят карту и смогут переставлять метки.</div>'}
   <div class="empty"><b>Импорт данных.</b> Загрузите файл data.json из Claude, чтобы перенести сотрудников и ориентиры.<br><input type="file" id="impFile" accept=".json,application/json" style="margin-top:6px"></div></div>`;
   document.getElementById('addMail').onclick=async()=>{const m=document.getElementById('newMail').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(m)){setNote('Введите email полностью.');return}
     try{await db.collection('allowed').doc(m).set({added:new Date().toISOString()});setNote('')}catch(e){setNote('Не удалось добавить: '+e.code)}};
   side.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{try{await db.collection('allowed').doc(b.dataset.del).delete()}catch(e){setNote('Не удалось убрать: '+e.code)}});
   document.getElementById('impFile').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());let n=0;
     for(const c of COLL)for(const o of (data[c]||[])){const {id,...rest}=o;await db.collection(c).doc(id).set(rest);n++}setNote('Импортировано записей: '+n)}catch(e){setNote('Ошибка импорта: '+(e.code||e.message))}};
   return}
  if(editing){side.innerHTML=editorHtml();bindEditor();return}
  let items=st[tab].slice();const q=query.trim().toLowerCase();if(tab==='staff')items=items.filter(regMatch);
  if(q)items=items.filter(o=>JSON.stringify(o).toLowerCase().includes(q));
  if(tab==='staff')items.sort((a,b)=>(a.regUntil||'9999')<(b.regUntil||'9999')?-1:1);else items.sort((a,b)=>String(a.name).localeCompare(String(b.name),'ru'));
  const nBad=(st.staff||[]).filter(o=>regCls(o.regUntil)==='bad').length,nNone=(st.staff||[]).filter(o=>!o.regUntil).length;
  const filt=tab==='staff'?`<div class="listhead" style="padding-top:0"><label for="regF" style="font-size:12px;color:var(--muted);white-space:nowrap">Регистрация</label><select id="regF"><option value="">все сроки (${(st.staff||[]).length})</option>${nBad?`<option value="bad"${regMonth==='bad'?' selected':''}>просрочена (${nBad})</option>`:''}${monthOptions()}<option value="none"${regMonth==='none'?' selected':''}>без даты${nNone?' ('+nNone+')':''}</option></select></div>${regMonth?`<div class="note" style="color:var(--muted)">На карте и в списке: ${items.length} из ${(st.staff||[]).length}. Остальные сотрудники скрыты.</div>`:''}`:'';
  const head=`<div class="listhead"><input id="q" type="search" placeholder="Поиск" value="${esc(query)}"><button class="btn primary sm" id="addBtn" type="button">+ Добавить ${LABEL[tab]}</button></div>`+filt;
  const emptyTxt={staff:'Сотрудников пока нет. Нажмите «Добавить» или кликните по карте.',competitors:'Конкурентов пока нет. Кликните по карте там, где стоит конкурент, и выберите «Конкурент».',landmarks:'Ориентиров пока нет. Кликните по карте и выберите «Ориентир», например «Кольцо» или «ЦУМ».'}[tab];
  side.innerHTML=head+`<div class="list">`+(items.length?items.map(o=>cardHtml(tab,o)).join(''):`<div class="empty">${emptyTxt}</div>`)+`</div>`;
  const qi=document.getElementById('q');qi.oninput=()=>{query=qi.value;renderSide();const n=document.getElementById('q');n.focus();n.setSelectionRange(n.value.length,n.value.length)};
  document.getElementById('addBtn').onclick=()=>startEdit(tab,null);
  const rf=document.getElementById('regF');if(rf)rf.onchange=()=>{regMonth=rf.value;popup=null;renderSide();buildMarks();renderPop()};
  side.querySelectorAll('.card').forEach(c=>c.onclick=e=>{const id=c.dataset.id;const act=e.target.closest('[data-act]');
    if(act){e.stopPropagation();const a=act.dataset.act;if(a==='place')startPlacing(tab,id);if(a==='edit')startEdit(tab,id);return}
    const o=find(tab,id);if(o&&hasPos(o)){centerOn(o);openCard(tab,id)}else startEdit(tab,id)})}
function cardHtml(coll,o){const sel=selected&&selected.id===o.id?' sel':'';const pos=hasPos(o)?'':`<span class="off">не на карте</span>`;
  const btn=hasPos(o)?(coll==='landmarks'?'':`<button class="btn sm" data-act="place" type="button">Переместить</button> `)+`<button class="btn sm" data-act="edit" type="button">Изменить</button>`:`<button class="btn sm primary" data-act="place" type="button">Поставить на карту</button>`;
  if(coll==='staff'){const c=regCls(o.regUntil);
    return `<div class="card${sel}" data-id="${esc(o.id)}"><div class="top"><b>${esc(o.name)}</b><span class="st ${c}">${o.regUntil?'до '+fmt(o.regUntil):'нет даты'}</span></div>
     <div class="meta"><span>${esc(o.role||'—')}</span><span>${esc(o.spot||'место не указано')}</span>${o.workUntil?`<span>работает до ${fmt(o.workUntil)}</span>`:''}${pos}</div>
     <div class="meta"><span class="mono">${esc(o.phone||'')}</span><span class="spacer"></span>${btn}</div></div>`}
  return `<div class="card${sel}" data-id="${esc(o.id)}"><div class="top"><b>${esc(o.name)}</b>${pos}</div>${o.note?`<div class="meta">${esc(o.note)}</div>`:''}<div class="meta"><span class="spacer"></span>${btn}</div></div>`}

function editorHtml(){const {coll,o,isNew}=editing;const del=!isNew?`<button class="btn danger" type="button" id="delBtn">${confirmDel===o.id?'Точно удалить? Нажмите ещё раз':'Удалить'}</button>`:'';
  const posTxt=hasPos(o)?`<span class="mono">${o.lat.toFixed(5)}, ${o.lon.toFixed(5)}</span>`+(coll==='landmarks'?' · ориентиры закреплены и не перемещаются':` <button class="btn sm" type="button" id="mvBtn">Переместить</button> <button class="btn sm" type="button" id="unBtn">Убрать с карты</button>`):`не на карте <button class="btn sm primary" type="button" id="mvBtn">Поставить на карту</button>`;
  let f='';
  if(coll==='staff')f=`
    <label>ФИО<input id="f-name" required value="${esc(o.name)}"></label>
    <label>Должность<input id="f-role" value="${esc(o.role)}" placeholder="промоутер Баумана"></label>
    <label>Где стоит (ориентир)<input id="f-spot" value="${esc(o.spot)}" placeholder="например: у ЦУМа, вход со стороны Баумана"></label>
    <div class="two"><label>Работает до<input id="f-workUntil" type="date" value="${esc(o.workUntil)}"></label><label>Регистрация до<input id="f-regUntil" type="date" value="${esc(o.regUntil)}"></label></div>
    <label>Телефон<input id="f-phone" value="${esc(o.phone)}" inputmode="tel"></label>
    <div class="two"><label>Адрес регистрации<input id="f-regAddr" value="${esc(o.regAddr)}"></label><label>Где живёт<input id="f-liveAddr" value="${esc(o.liveAddr)}"></label></div>
    <label>Заметка<textarea id="f-note" rows="2">${esc(o.note)}</textarea></label>`;
  else if(coll==='competitors')f=`
    <label>Кто / бренд<input id="f-name" required value="${esc(o.name)}" placeholder="например: промоутер «Ленты-Опт»"></label>
    <label>Где стоит<input id="f-spot" value="${esc(o.spot)}"></label>
    <label>Что предлагают, цены, заметки<textarea id="f-note" rows="3">${esc(o.note)}</textarea></label>
    <label>Когда замечен<input id="f-seen" type="date" value="${esc(o.seen)}"></label>`;
  else f=`<label>Название<input id="f-name" required value="${esc(o.name)}" placeholder="например: Кольцо, ЦУМ, Часы на Баумана"></label><label>Заметка<input id="f-note" value="${esc(o.note)}"></label>
    <label>Как показывать на карте<select id="f-icon"><option value="">Точка с подписью</option>${Object.keys(PH).map(k=>`<option value="${k}"${o.icon===k?' selected':''}>Фото: ${PHT[k]||k}</option>`).join('')}${Object.entries(ICONS).filter(([k])=>!PH[k]).map(([k,v])=>`<option value="${k}"${o.icon===k?' selected':''}>Рисунок: ${v.t}</option>`).join('')}</select></label>`;
  return `<form class="ed" id="edForm"><h2>${isNew?'Новый '+(coll==='landmarks'?'ориентир':coll==='staff'?'сотрудник':'конкурент'):'Изменить'}</h2>${f}
    <div style="font-size:12px;color:var(--muted)">На карте: ${posTxt}</div>
    <div class="acts"><button class="btn primary" type="submit">Сохранить</button><button class="btn" type="button" id="cancelBtn">Отмена</button><span class="spacer"></span>${del}</div></form>`}
const FIELDS={staff:['name','role','spot','workUntil','regUntil','phone','regAddr','liveAddr','note'],competitors:['name','spot','note','seen'],landmarks:['name','note','icon']};
function readForm(){const {coll,o}=editing;const n={...o};FIELDS[coll].forEach(k=>{const el=document.getElementById('f-'+k);if(el)n[k]=el.value.trim()});return n}
function bindEditor(){const {coll}=editing;
  document.getElementById('edForm').onsubmit=async e=>{e.preventDefault();const n=readForm();if(!n.name){document.getElementById('f-name').focus();return}
    if(await save(coll,n)){selected={coll,id:n.id};editing=null;confirmDel=null;renderAll()}};
  document.getElementById('cancelBtn').onclick=()=>{editing=null;confirmDel=null;renderAll()};
  const mv=document.getElementById('mvBtn');if(mv)mv.onclick=()=>{editing.o=readForm();startPlacing(coll,editing.o.id,true)};
  const un=document.getElementById('unBtn');if(un)un.onclick=()=>{const n=readForm();delete n.lat;delete n.lon;editing.o=n;renderSide()};
  const d=document.getElementById('delBtn');if(d)d.onclick=async()=>{const id=editing.o.id;if(confirmDel!==id){confirmDel=id;renderSide();return}
    await remove(coll,id);editing=null;confirmDel=null;popup=null;renderAll()}}

function startEdit(coll,id,pos){tab=coll;confirmDel=null;placing=null;showBanner();
  const o=id?{...find(coll,id)}:{id:newId(),name:''};if(pos){o.lat=pos[0];o.lon=pos[1]}
  editing={coll,o,isNew:!id};popup=null;renderAll();setTimeout(()=>{const n=document.getElementById('f-name');if(n&&!n.value)n.focus()},0)}
function startPlacing(coll,id,fromEditor){placing={coll,id,fromEditor};popup=null;stage.classList.add('placing');
  const o=fromEditor?editing.o:find(coll,id);showBanner(fromEditor?`Нажмите на карту, где стоит: ${esc(o&&o.name||'новая точка')}`:`Перетащите метку «${esc(o&&o.name||'')}» или нажмите на карту, где она теперь стоит`);renderPop();buildMarks()}
function showBanner(html){const b=document.getElementById('banner');if(!html){const was=!b.hidden;b.hidden=true;stage.classList.remove('placing');if(was)buildMarks();return}
  b.innerHTML=`<span>${html}</span><button type="button" id="bCancel">Отмена</button>`;b.hidden=false;document.getElementById('bCancel').onclick=()=>{placing=null;showBanner()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(placing){placing=null;showBanner()}else if(popup){popup=null;renderPop()}}});

async function mapClick(x,y){const [lat,lon]=fromXY(x,y);
  if(placing){const p=placing;placing=null;showBanner();
    if(p.fromEditor){editing.o.lat=lat;editing.o.lon=lon;renderAll();return}
    const o=find(p.coll,p.id);if(o){await save(p.coll,{...o,lat,lon});selected={coll:p.coll,id:o.id};renderAll()}return}
  if(popup){popup=null;renderPop();return}
  const unplaced=st.staff.filter(o=>!hasPos(o));
  popup={x,y,html:`<button class="x" type="button" data-pa="close" aria-label="Закрыть">×</button><h3>Добавить точку здесь</h3><div class="sub mono">${lat.toFixed(5)}, ${lon.toFixed(5)}</div>
   ${unplaced.length?`<label class="sub" for="pickStaff">Сотрудник из списка (ещё не на карте)</label><select id="pickStaff">${unplaced.map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('')}</select>
   <div class="acts" style="margin-bottom:8px"><button class="btn primary sm" type="button" data-pa="putStaff">Поставить сюда</button></div>`:''}
   <div class="acts"><button class="btn sm" type="button" data-pa="newStaff">+ Новый сотрудник</button><button class="btn sm" type="button" data-pa="newComp" style="color:var(--comp)">+ Конкурент</button><button class="btn sm" type="button" data-pa="newLm">+ Ориентир</button></div>`,
   act:async a=>{if(a==='close'){popup=null;renderPop()}
     if(a==='putStaff'){const id=document.getElementById('pickStaff').value;const o=find('staff',id);popup=null;if(o){await save('staff',{...o,lat,lon});selected={coll:'staff',id};tab='staff'}renderAll()}
     if(a==='newStaff')startEdit('staff',null,[lat,lon]);if(a==='newComp')startEdit('competitors',null,[lat,lon]);if(a==='newLm')startEdit('landmarks',null,[lat,lon])}};
  renderPop()}
function openCard(coll,id){const o=find(coll,id);if(!o||!hasPos(o))return;selected={coll,id};const [x,y]=toXY(o.lat,o.lon);
  let body='';
  if(coll==='staff'){const c=regCls(o.regUntil);body=`<div class="sub">${esc(o.role||'—')}</div><div class="rows">
    <span>Где стоит</span><span>${esc(o.spot||'не указано')}</span>
    <span>Работает до</span><span>${fmt(o.workUntil)}</span>
    <span>Регистрация</span><span><span class="st ${c}">${o.regUntil?'до '+fmt(o.regUntil):'нет даты'}</span> ${o.regUntil?esc(regTxt(o.regUntil)):''}</span>
    <span>Телефон</span><span class="mono">${esc(o.phone||'—')}</span></div>`}
  else body=`<div class="sub">${coll==='competitors'?'Конкурент':'Ориентир'}</div><div class="rows">${o.spot?`<span>Где</span><span>${esc(o.spot)}</span>`:''}${o.note?`<span>Заметка</span><span>${esc(o.note)}</span>`:''}${o.seen?`<span>Замечен</span><span>${fmt(o.seen)}</span>`:''}</div>`;
  popup={x,y,html:`<button class="x" type="button" data-pa="close" aria-label="Закрыть">×</button><h3>${esc(o.name)}</h3>${body}
    <div class="acts"><button class="btn sm" type="button" data-pa="edit">Изменить</button>${coll==='landmarks'?'':'<button class="btn sm" type="button" data-pa="move">Переместить</button>'}<button class="btn sm danger" type="button" data-pa="del">${confirmDel===id?'Точно удалить?':'Удалить'}</button></div>`,
    act:async a=>{if(a==='close'){popup=null;selected=null;renderAll()}if(a==='edit')startEdit(coll,id);if(a==='move'&&coll!=='landmarks')startPlacing(coll,id);
      if(a==='del'){if(confirmDel!==id){confirmDel=id;openCard(coll,id);return}confirmDel=null;popup=null;selected=null;await remove(coll,id);renderAll()}}};
  tab=coll;if(!editing)renderSide();buildMarks();renderPop()}
function renderPop(){popWrap.innerHTML='';if(!popup)return;const el=document.createElement('div');el.className='pop';el.innerHTML=popup.html;
  el.addEventListener('pointerdown',e=>e.stopPropagation());el.addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('[data-pa]');if(b)popup.act(b.dataset.pa)});
  popWrap.appendChild(el);placePop()}
function centerOn(o){const r=stage.getBoundingClientRect();const [x,y]=toXY(o.lat,o.lon);if(S<1)S=1.2;TX=r.width/2-x*S;TY=r.height*0.58-y*S;apply()}
function renderAll(){summary();renderSide();buildMarks();if(popup&&selected){const o=find(selected.coll,selected.id);if(!o)popup=null}renderPop()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;editing=null;query='';renderSide()});

// theme
function setTheme(t){document.documentElement.setAttribute('data-map',t);document.getElementById('themeBtn').textContent=t==='dark'?'Светлый фон':'Тёмный фон';try{localStorage.setItem('kzn-map-theme',t)}catch(e){}}
let th='light';try{th=localStorage.getItem('kzn-map-theme')||'light'}catch(e){}
setTheme(th);document.getElementById('themeBtn').onclick=()=>setTheme(document.documentElement.getAttribute('data-map')==='dark'?'light':'dark');

buildLabels();home();renderAll();
</script>

</body></html>
